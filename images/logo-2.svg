<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 8 280 248" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Linear Gradient for Cap & Elements -->
    <linearGradient id="goldLustre2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- High-Sheen Gold for Pages & Rims -->
    <linearGradient id="goldSheen2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#FDE68A"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Deep Metallic Gold Gradient for Brand Text -->
    <linearGradient id="goldText2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542403"/>
      <stop offset="18%" stop-color="#8B4505"/>
      <stop offset="42%" stop-color="#D97706"/>
      <stop offset="68%" stop-color="#F59E0B"/>
      <stop offset="88%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#4E2002"/>
    </linearGradient>

    <!-- Radial 3D Sphere Gradient for Atomic Nucleus -->
    <radialGradient id="goldSphere2" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>

    <!-- Depth Shadow Filter -->
    <filter id="softShadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ==========================================
       CENTERED EMBLEM
       Emblem Center: CX=160, CY=75
       Scale: 1.25x of base
       ========================================== -->
  <g id="brandEmblemStacked" transform="translate(160, 72) scale(1.22) translate(-60, -60)" filter="url(#softShadow2)">
    <!-- 1. Open Book Foundation (V-Shaped Pages) -->
    <!-- Outer Spine & Main Leaf Left -->
    <path d="M 60 102 C 46 95, 30 92, 18 97 C 22 83, 34 78, 48 83 C 53 84.5, 57 87, 60 90 Z" fill="url(#goldSheen2)" />
    <!-- Outer Spine & Main Leaf Right -->
    <path d="M 60 102 C 74 95, 90 92, 102 97 C 98 83, 86 78, 72 83 C 67 84.5, 63 87, 60 90 Z" fill="url(#goldSheen2)" />

    <!-- Secondary Page Layer Left -->
    <path d="M 60 96 C 48 89, 36 86, 25 89 C 29 78, 40 75, 52 79 C 55 80, 58 82, 60 84 Z" fill="url(#goldLustre2)" opacity="0.95" />
    <!-- Secondary Page Layer Right -->
    <path d="M 60 96 C 72 89, 84 86, 95 89 C 91 78, 80 75, 68 79 C 65 80, 62 82, 60 84 Z" fill="url(#goldLustre2)" opacity="0.95" />

    <!-- Tertiary Upper Fan Leaf Left -->
    <path d="M 60 88 C 50 82, 41 80, 32 82 C 37 73, 46 71, 56 74 C 57.5 74.5, 59 75.5, 60 76.5 Z" fill="url(#goldSheen2)" />
    <!-- Tertiary Upper Fan Leaf Right -->
    <path d="M 60 88 C 70 82, 79 80, 88 82 C 83 73, 74 71, 64 74 C 62.5 74.5, 61 75.5, 60 76.5 Z" fill="url(#goldSheen2)" />

    <!-- Book Center Ridge / Spine Rib -->
    <polygon points="59,104 61,104 60.5,78 59.5,78" fill="url(#goldLustre2)" />

    <!-- 2. Atomic Orbital System & Halo -->
    <circle cx="60" cy="58" r="28" fill="none" stroke="url(#goldSheen2)" stroke-width="2.2" stroke-dasharray="88 8 18 6" opacity="0.85" />

    <!-- Orbital Rings -->
    <ellipse cx="60" cy="58" rx="26" ry="11" fill="none" stroke="url(#goldLustre2)" stroke-width="2" transform="rotate(-35, 60, 58)" />
    <ellipse cx="60" cy="58" rx="26" ry="11" fill="none" stroke="url(#goldLustre2)" stroke-width="2" transform="rotate(35, 60, 58)" />
    <ellipse cx="60" cy="58" rx="26" ry="11" fill="none" stroke="url(#goldSheen2)" stroke-width="2" transform="rotate(85, 60, 58)" />

    <!-- Electrons on Orbital Paths -->
    <circle cx="42" cy="46" r="2" fill="url(#goldSphere2)" />
    <circle cx="78" cy="70" r="2" fill="url(#goldSphere2)" />
    <circle cx="76" cy="48" r="1.8" fill="url(#goldSphere2)" />
    <circle cx="44" cy="68" r="1.8" fill="url(#goldSphere2)" />
    <circle cx="60" cy="32" r="2" fill="url(#goldSphere2)" />

    <!-- Central Glowing 3D Golden Nucleus -->
    <circle cx="60" cy="58" r="6.5" fill="url(#goldSphere2)" />

    <!-- 3. Graduation Mortarboard Cap (Crowning Apex) -->
    <!-- Skull Cap Base / Undercap Band -->
    <path d="M 44 26 C 44 32, 76 32, 76 26 C 72 35, 48 35, 44 26 Z" fill="url(#goldSheen2)" />

    <!-- Diamond Mortarboard Top -->
    <polygon points="60,9 88,22 60,33 32,22" fill="url(#goldLustre2)" />
    <polygon points="60,9 60,33 32,22" fill="url(#goldSheen2)" opacity="0.45" />

    <!-- Cap Top Center Golden Button / Stud -->
    <ellipse cx="60" cy="21" rx="2.4" ry="1.4" fill="url(#goldSphere2)" />

    <!-- Tassel Ribbon & Fringed Brush -->
    <path d="M 60 21 Q 76 21 82 28 Q 87 34 85 43" fill="none" stroke="url(#goldLustre2)" stroke-width="1.8" stroke-linecap="round" />
    <ellipse cx="85" cy="44" rx="2.2" ry="1.2" fill="url(#goldSheen2)" />
    <polygon points="83,44 87,44 89,52 81,52" fill="url(#goldLustre2)" />
  </g>

  <!-- ==========================================
       CENTERED TYPOGRAPHY
       Enlarged & Bold Stacked Typography
       ========================================== -->
  <g id="brandTypographyStacked">
    <!-- Line 1: THE EDU -->
    <text x="160" y="174"
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Montserrat', 'Cinzel', 'Inter', sans-serif"
          font-size="36"
          font-weight="900"
          letter-spacing="4.5"
          fill="url(#goldText2)">THE EDU</text>

    <!-- Line 2: CONSULTANT -->
    <text x="160" y="214"
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Montserrat', 'Cinzel', 'Inter', sans-serif"
          font-size="38"
          font-weight="900"
          letter-spacing="5.5"
          fill="url(#goldText2)">CONSULTANT</text>

    <!-- Line 3: ACADEMIC STRATEGIES | ADMISSION COUNSELLING -->
    <text x="160" y="240"
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif"
          font-size="10.8"
          font-weight="800"
          letter-spacing="1.5"
          fill="#6B3705">ACADEMIC STRATEGIES | ADMISSION COUNSELLING</text>
  </g>
</svg>
